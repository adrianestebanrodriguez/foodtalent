version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodtalent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/foodtalent
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - profile_storage:/app/storage

  celery_worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker -l info -Q profile_processing,search_processing,youtube_ingestion,web_ingestion
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/foodtalent
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - profile_storage:/app/storage

  celery_beat:
    build: ./backend
    command: celery -A app.tasks.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/foodtalent
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  profile_storage:
